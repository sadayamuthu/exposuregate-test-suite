version = 1
requires-python = ">=3.10"

[manifest]
members = [
    "core",
    "ws-root",
    "web",
]

[[package]]
name = "certifi"
version = "2024.6.2"
source = { registry = "https://pypi.org/simple" }
sdist = { url = "https://files.pythonhosted.org/packages/certifi-2024.6.2.tar.gz", hash = "sha256:3cd43f1c6fa7dedc5899d69d3ad0398fd018ad1a17fba83ddaf78aa46c747516", size = 164501 }

[[package]]
name = "core"
version = "0.1.0"
source = { editable = "packages/core" }
dependencies = [
    { name = "requests" },
]

[package.metadata]
requires-dist = [{ name = "requests", specifier = ">=2.31" }]

[[package]]
name = "requests"
version = "2.32.3"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "certifi" },
]
sdist = { url = "https://files.pythonhosted.org/packages/requests-2.32.3.tar.gz", hash = "sha256:55365417734eb18255590a9ff9eb97e9e1da868d4ccd6402399eaf68af20a760", size = 131218 }

[[package]]
name = "web"
version = "0.1.0"
source = { editable = "packages/web" }
dependencies = [
    { name = "core" },
]

[[package]]
name = "ws-root"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "web" },
]
